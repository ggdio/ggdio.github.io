<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A66C2"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="rounded">
      <rect width="32" height="32" rx="7" ry="7"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" ry="7" fill="#0B0B0B"/>

  <!-- Glass border -->
  <rect width="32" height="32" rx="7" ry="7" fill="none" stroke="url(#grad)" stroke-width="1" opacity="0.5"/>

  <!-- Ambient glow blob -->
  <ellipse cx="16" cy="16" rx="12" ry="10" fill="#8B5CF6" opacity="0.12" filter="url(#glow)" clip-path="url(#rounded)"/>

  <!-- G -->
  <text
    x="4.5"
    y="23"
    font-family="'SF Pro Display', 'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="17"
    font-weight="700"
    letter-spacing="-0.5"
    fill="url(#grad)"
  >GD</text>
</svg>
